[project]
name = "tg-voice-assistant"
version = "0.1.0"
description = "Telegram Business bot that posts normalized text after voice messages."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "openai>=1.99.0",
  "pydantic-settings>=2.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
